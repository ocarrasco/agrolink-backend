spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrolink}
    username: ${DB_USERNAME:agrolink}
    password: ${DB_PASSWORD:agrolink}
    hikari:
      pool-name: AgroLinkPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    # Separate migration credentials (DDL) from the runtime pool above (DML only) — see
    # docs/deployment.md step 4. Defaults to the same datasource when unset, so local/dev
    # (single DB user) keeps working unchanged.
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
    locations: classpath:migration,classpath:seed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/AgroLink}
          # override when the issuer-uri host isn't reachable from this container (e.g. docker-compose,
          # where the browser-facing issuer is localhost but the app must fetch keys via the service name)
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:AgroLink}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:agro-link-backend-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

recommender:
  # recommender-services microservice — purchase recommendations for /retailer/order-suggestions
  base-url: ${RECOMMENDER_SERVICE_URL:http://localhost:9990}
  retry:
    # exponential backoff: attempt n waits initial-interval-ms * multiplier^(n-1), capped at max-interval-ms
    max-attempts: ${RECOMMENDER_RETRY_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RECOMMENDER_RETRY_INITIAL_INTERVAL_MS:200}
    multiplier: ${RECOMMENDER_RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${RECOMMENDER_RETRY_MAX_INTERVAL_MS:2000}

agrolink:
  startup-sync:
    # pull the Keycloak roster into platform_user on ApplicationReadyEvent (StartupUserSync)
    enabled: ${AGROLINK_STARTUP_SYNC_ENABLED:true}
  startup-seed:
    # fill unconfigured user_profile rows from init/suppliers.json (StartupProfileSeeder)
    enabled: ${AGROLINK_STARTUP_SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: agro-link-backend
